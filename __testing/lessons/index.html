  <!-- https://stefenphelps.com/blog/simple-video-modal-with-no-dependencies/ -->
  <!-- Vimeo caches the iframe's internal video, even if src is correct: disable that somehow!!! -->
  <!-- If using `.setCurrentTime` do NOT use `#t=1m2s` in the url as well -->
  <!-- https://github.com/vimeo/player.js (loadVideo?) -->
  <script>
    const elements = document.getElementsByClassName("open-modal");
    const modal = document.querySelector(".video-modal");
    const video = document.querySelector(".video-modal video");

    function onOpen(element) {
      // Video id (working)
      const video_id = element.getAttribute('data-id')
      console.log("ID:", video_id)
      // Video time (working)
      const video_time = element.getAttribute('data-time')
      console.log("Time:", video_time)

      // Set Vimeo's player options
      const options = {
        id: video_id,
        width: 640
        // loop: true
      };
      const player = new Vimeo.Player('vimeo-player', options);
      player.setCurrentTime(video_time) // # seconds offset

      // Assign the src to iframe ... (not working)
      // document.getElementById("vimeo").src = source;
      // .showModal() is part of the HTMLDialogElement API
      modal.showModal();
    }

    // Cycle all `open-modal`s and add event, passing in "this"
    Array.from(elements).forEach(function(element) {
      // Add the on click event handler
      element.addEventListener('click', () => onOpen(element));
    });

    modal.addEventListener("close", function onClose() {
      // "Close" button inside the form triggers "close" on dialog because of [method="dialog"]
      // .pause() is part of the HTMLMediaElement API
      video.pause();
    });
  </script>
